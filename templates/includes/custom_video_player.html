{% load i18n %}

{% if lecture.get_video_id %}
<style>
    .custom-player-wrapper {
        position: relative;
        width: 100%;
        background-color: #000;
        border-radius: 12px;
        overflow: hidden;
        aspect-ratio: 16/9;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .video-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        pointer-events: none;
        /* يمنع الضغط المباشر على فيديو يوتيوب لتجنب ظهور أيقوناتهم */
    }

    /* طبقة شفافة فوق الفيديو للتحكم بالضغط للإيقاف والتشغيل ولمنع نقرات يوتيوب */
    .video-click-overlay {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 50px;
        z-index: 10;
        cursor: pointer;
    }

    .custom-controls {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
        padding: 15px 20px 10px;
        display: flex;
        flex-direction: column;
        z-index: 20;
        opacity: 0;
        transition: opacity 0.3s;
    }

    .custom-player-wrapper:hover .custom-controls,
    .custom-player-wrapper.paused .custom-controls {
        opacity: 1;
    }

    .progress-container {
        width: 100%;
        height: 6px;
        background: rgba(255, 255, 255, 0.2);
        cursor: pointer;
        border-radius: 3px;
        margin-bottom: 10px;
        position: relative;
    }

    .progress-bar-fill {
        height: 100%;
        background: #fd0000;
        width: 0%;
        border-radius: 3px;
        position: relative;
    }

    .progress-bar-fill::after {
        content: '';
        position: absolute;
        right: -6px;
        top: -4px;
        width: 14px;
        height: 14px;
        background: #fff;
        border-radius: 50%;
        box-shadow: 0 0 5px rgba(0, 0, 0, 0.5);
        opacity: 0;
        transition: opacity 0.2s;
    }

    .progress-container:hover .progress-bar-fill::after {
        opacity: 1;
    }

    .controls-main {
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    .controls-left,
    .controls-right {
        display: flex;
        align-items: center;
        gap: 15px;
    }

    .player-btn {
        background: none;
        border: none;
        color: white;
        font-size: 1.2rem;
        cursor: pointer;
        transition: color 0.2s, transform 0.1s;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .player-btn:hover {
        color: #0d6efd;
        transform: scale(1.1);
    }

    .time-display {
        font-family: monospace;
        font-size: 0.9rem;
        user-select: none;
    }

    .volume-container {
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .volume-slider {
        width: 0;
        opacity: 0;
        transition: width 0.3s, opacity 0.3s;
        -webkit-appearance: none;
        height: 4px;
        background: rgba(255, 255, 255, 0.3);
        border-radius: 2px;
        outline: none;
    }

    .volume-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: white;
        cursor: pointer;
    }

    .volume-container:hover .volume-slider {
        width: 80px;
        opacity: 1;
    }

    .speed-select {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        padding: 2px 5px;
        font-size: 0.85rem;
        cursor: pointer;
        outline: none;
    }

    .speed-select option {
        background: #222;
        color: white;
    }

    /* شاشة التحميل (Loader) */
    .player-loader {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: #000;
        z-index: 50;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
    }

    .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #0d6efd;
        border-radius: 50%;
        animation: spin 1s linear infinite;
    }

    @keyframes spin {
        100% {
            transform: rotate(360deg);
        }
    }

    /* علامة مائية للمنصة لتزيد من شعور أنه لاعب خاص */
    .platform-watermark {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 15;
        opacity: 0.5;
        font-weight: bold;
        color: white;
        font-size: 1.5rem;
        user-select: none;
        pointer-events: none;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
    }

    /* كبسولة كود الطالب العائمة */
    .floating-watermark {
        position: absolute;
        top: 0;
        left: 0;
        padding: 8px 20px;
        background: rgba(255, 255, 255, 0.15);
        border: 1px solid rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 0.7);
        border-radius: 25px;
        backdrop-filter: blur(8px);
        font-family: monospace;
        font-weight: bold;
        font-size: 1.2rem;
        z-index: 15;
        pointer-events: none;
        user-select: none;
        will-change: transform;
    }
</style>

<div class="custom-player-wrapper paused" id="playerWrapper">

    <!-- شاشة التحميل -->
    <div class="player-loader" id="playerLoader">
        <div class="spinner mb-3"></div>
        <div class="fw-bold">{% trans "جاري تحميل المحاضرة..." %}</div>
    </div>

    <!-- العلامة المائية للمنصة -->
    <div class="platform-watermark">
        {{ request.site.name|default:"TA3ALM" }}
    </div>

    <!-- كبسولة كود الطالب العائمة -->
    <div class="floating-watermark" id="floatingWatermark">
        {{ request.user.custom_id|default:request.user.username|default:"TA3ALM-USER" }}
    </div>

    <div class="video-container" id="yt-player-container"></div>
    <div class="video-click-overlay" id="clickOverlay"></div>

    <div class="custom-controls">
        <div class="progress-container" id="progressContainer">
            <div class="progress-bar-fill" id="progressBar"></div>
        </div>

        <div class="controls-main">
            <div class="controls-left">
                <button class="player-btn" id="playPauseBtn" title="{% trans "تشغيل / إيقاف" %}">
                    <i class="bi bi-play-fill fs-3"></i>
                </button>

                <div class="volume-container">
                    <button class="player-btn" id="muteBtn" title="{% trans "كتم الصوت" %}">
                        <i class="bi bi-volume-up-fill"></i>
                    </button>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100">
                </div>

                <div class="time-display">
                    <span id="currentTime">00:00</span> / <span id="durationTime">00:00</span>
                </div>
            </div>

            <div class="controls-right">
                <select class="speed-select" id="speedSelect" title="{% trans "سرعة التشغيل" %}">
                    <option value="0.5">0.5x</option>
                    <option value="0.75">0.75x</option>
                    <option value="1" selected>{% trans "1x (عادي)" %}</option>
                    <option value="1.25">1.25x</option>
                    <option value="1.5">1.5x</option>
                    <option value="2">2x</option>
                </select>

                <button class="player-btn" id="fullscreenBtn" title="{% trans "ملء الشاشة" %}">
                    <i class="bi bi-fullscreen"></i>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- تحميل API يوتيوب -->
<script src="https://www.youtube.com/iframe_api"></script>
<script>
    let player;
    let progressInterval;
    const videoId = '{{ lecture.get_video_id }}';

    const wrapper = document.getElementById('playerWrapper');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const playIcon = playPauseBtn.querySelector('i');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationTimeEl = document.getElementById('durationTime');
    const muteBtn = document.getElementById('muteBtn');
    const volumeIcon = muteBtn.querySelector('i');
    const volumeSlider = document.getElementById('volumeSlider');
    const fullscreenBtn = document.getElementById('fullscreenBtn');
    const speedSelect = document.getElementById('speedSelect');
    const clickOverlay = document.getElementById('clickOverlay');
    const loader = document.getElementById('playerLoader');

    function onYouTubeIframeAPIReady() {
        player = new YT.Player('yt-player-container', {
            videoId: videoId,
            width: '100%',
            height: '100%',
            playerVars: {
                'autoplay': 0,
                'controls': 0,        // إخفاء أزرار يوتيوب
                'disablekb': 1,       // إيقاف اختصارات الكيبورد الخاصة بيوتيوب
                'fs': 0,              // إخفاء زر ملء الشاشة الخاص بيوتيوب
                'modestbranding': 1,  // إخفاء اللوجو
                'rel': 0,             // عدم إظهار فيديوهات مقترحة غريبة
                'showinfo': 0,
                'iv_load_policy': 3   // إخفاء التعليقات التوضيحية
            },
            events: {
                'onReady': onPlayerReady,
                'onStateChange': onPlayerStateChange
            }
        });
    }

    function formatTime(seconds) {
        if (!seconds) return '00:00';
        seconds = Math.floor(seconds);
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
    }

    function onPlayerReady(event) {
        // إخفاء شاشة التحميل
        loader.style.display = 'none';
        durationTimeEl.textContent = formatTime(player.getDuration());

        // إعداد الصوت
        player.setVolume(100);

        // بدء حركة كود الطالب (DVD Bounce Effect)
        requestAnimationFrame(animateWatermark);
    }

    // متغيرات حركة الكبسولة
    let posX = Math.random() * 100;
    let posY = Math.random() * 100;
    let dirX = 1;
    let dirY = 1;
    const speed = 1.2;

    function animateWatermark() {
        const floatingEl = document.getElementById('floatingWatermark');
        if (!floatingEl || !wrapper) return;

        const maxX = wrapper.clientWidth - floatingEl.clientWidth;
        const maxY = wrapper.clientHeight - floatingEl.clientHeight;

        posX += dirX * speed;
        posY += dirY * speed;

        if (posX <= 0) { posX = 0; dirX = 1; }
        else if (posX >= maxX) { posX = maxX; dirX = -1; }

        if (posY <= 0) { posY = 0; dirY = 1; }
        else if (posY >= maxY) { posY = maxY; dirY = -1; }

        floatingEl.style.transform = `translate(${posX}px, ${posY}px)`;
        requestAnimationFrame(animateWatermark);
    }

    function onPlayerStateChange(event) {
        if (event.data == YT.PlayerState.PLAYING) {
            wrapper.classList.remove('paused');
            playIcon.className = 'bi bi-pause-fill fs-3';
            progressInterval = setInterval(updateProgress, 500);
        } else {
            wrapper.classList.add('paused');
            playIcon.className = 'bi bi-play-fill fs-3';
            clearInterval(progressInterval);
        }
    }

    function updateProgress() {
        if (!player || !player.getCurrentTime) return;
        const current = player.getCurrentTime();
        const duration = player.getDuration();
        const percent = (current / duration) * 100;
        progressBar.style.width = percent + '%';
        currentTimeEl.textContent = formatTime(current);
    }

    function togglePlay() {
        if (!player || !player.getPlayerState) return;
        const state = player.getPlayerState();
        if (state == YT.PlayerState.PLAYING) {
            player.pauseVideo();
        } else {
            player.playVideo();
        }
    }

    playPauseBtn.addEventListener('click', togglePlay);
    clickOverlay.addEventListener('click', togglePlay);

    // شريط التقدم
    progressContainer.addEventListener('click', (e) => {
        if (!player || !player.seekTo) return;
        const rect = progressContainer.getBoundingClientRect();
        const pos = (e.clientX - rect.left) / rect.width;
        const newTime = pos * player.getDuration();
        player.seekTo(newTime);
        updateProgress();
    });

    // الصوت
    muteBtn.addEventListener('click', () => {
        if (!player || !player.isMuted) return;
        if (player.isMuted()) {
            player.unMute();
            volumeIcon.className = 'bi bi-volume-up-fill';
            volumeSlider.value = player.getVolume();
        } else {
            player.mute();
            volumeIcon.className = 'bi bi-volume-mute-fill';
            volumeSlider.value = 0;
        }
    });

    volumeSlider.addEventListener('input', (e) => {
        if (!player || !player.setVolume) return;
        const val = e.target.value;
        player.setVolume(val);
        if (val == 0) {
            player.mute();
            volumeIcon.className = 'bi bi-volume-mute-fill';
        } else {
            player.unMute();
            if (val > 50) volumeIcon.className = 'bi bi-volume-up-fill';
            else volumeIcon.className = 'bi bi-volume-down-fill';
        }
    });

    // السرعة
    speedSelect.addEventListener('change', (e) => {
        if (!player || !player.setPlaybackRate) return;
        player.setPlaybackRate(parseFloat(e.target.value));
    });

    // ملء الشاشة
    fullscreenBtn.addEventListener('click', () => {
        if (!document.fullscreenElement) {
            wrapper.requestFullscreen().catch(err => {
                console.error(`Error attempting to enable full-screen mode: ${err.message}`);
            });
        } else {
            document.exitFullscreen();
        }
    });

    // تغيير أيقونة ملء الشاشة عند التغيير
    document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
            fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen-exit"></i>';
        } else {
            fullscreenBtn.innerHTML = '<i class="bi bi-fullscreen"></i>';
        }
    });

</script>

{% else %}
<!-- فيديوهات خارجية غير يوتيوب تبقى بالمشغل العادي -->
<div class="ratio ratio-16x9 bg-dark shadow rounded mb-3 overflow-hidden">
    <iframe src="{{ lecture.video_link }}" title="Video player" frameborder="0"
        allow="autoplay; fullscreen; picture-in-picture" allowfullscreen
        style="width: 100%; height: 100%; border-radius: 12px;">
    </iframe>
</div>
{% endif %}
