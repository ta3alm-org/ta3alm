<div class="ap-form-grid">
    <div class="ap-field ap-col-full">
        <label class="ap-label" for="planFieldName">اسم الباقة</label>
        <input type="text" id="planFieldName" name="name" class="ap-input" value="{{ obj.name|default:'' }}" required>
    </div>
    <div class="ap-field">
        <label class="ap-label" for="planFieldPrice">السعر (EGP / شهر)</label>
        <input type="number" id="planFieldPrice" name="price" class="ap-input" value="{{ obj.price|default:'0' }}" min="0" required>
    </div>
    <div class="ap-field">
        <label class="ap-label" for="planFieldStudents">حد الطلاب</label>
        <input type="number" id="planFieldStudents" name="student_limit" class="ap-input" value="{{ obj.student_limit|default:'1000' }}" min="1">
    </div>
    <div class="ap-field">
        <label class="ap-label" for="planFieldGroups">حد المجموعات</label>
        <input type="number" id="planFieldGroups" name="group_limit" class="ap-input" value="{{ obj.group_limit|default:'5' }}" min="1">
    </div>
    <div class="ap-field">
        <label class="ap-label" for="planFieldAssistants">حد المساعدين</label>
        <input type="number" id="planFieldAssistants" name="assistant_limit" class="ap-input" value="{{ obj.assistant_limit|default:'2' }}" min="0">
    </div>
    <div class="ap-field ap-col-full">
        <label class="ap-label" for="planFieldDesc">وصف الباقة</label>
        <textarea id="planFieldDesc" name="desc" class="ap-textarea" rows="3">{{ obj.description|default:'' }}</textarea>
    </div>
    <div class="ap-field ap-col-full ap-gap-2">
        <label class="ap-switch-row" for="online_{{ obj.id|default:'new' }}">
            <span class="ap-switch-label">تفعيل حزم الأونلاين</span>
            <input type="checkbox" name="allow_online" value="on" class="ap-switch" id="online_{{ obj.id|default:'new' }}"
                   {% if obj.allow_online_packages %}checked{% endif %}>
        </label>
        <label class="ap-switch-row" for="images_{{ obj.id|default:'new' }}">
            <span class="ap-switch-label">رفع صور في الأسئلة</span>
            <input type="checkbox" name="allow_images" value="on" class="ap-switch" id="images_{{ obj.id|default:'new' }}"
                   {% if obj.allow_question_images %}checked{% endif %}>
        </label>
        <label class="ap-switch-row" for="default_{{ obj.id|default:'new' }}">
            <span class="ap-switch-label">تعيين كباقة افتراضية للمعلمين الجدد</span>
            <input type="checkbox" name="is_default" value="on" class="ap-switch" id="default_{{ obj.id|default:'new' }}"
                   {% if obj.is_default %}checked{% endif %}>
        </label>
    </div>
</div>
